# docker-compose.yml — DeepStream RTSP output pipeline + Monitoring Stack
#
# Usage:
#   docker compose up -d
#
# Prerequisites:
#   - NVIDIA Container Toolkit + nvidia-docker2 on the host
#   - NVIDIA DeepStream 6.4 SDK
#
version: "3.9"

services:
  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: uit_medseg/mlflow-server:dev
    container_name: uit_medseg_mlflow
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ${PWD}:/mmlab_students/storageStudents/nguyenvd/uit_medseg/CS317_MLOps
    working_dir: /mmlab_students/storageStudents/nguyenvd/uit_medseg/CS317_MLOps

  vision-service:
    build:
      context: .
      dockerfile: Dockerfile.ds64_glib
    image: uit_medseg/vision-service:dev
    container_name: uit_medseg_vision
    restart: unless-stopped
    shm_size: 2g
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: uit-medseg-vision
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GPU_ID: ${GPU_ID:-0}
      CONFIG_DIR: /workspace/apps/vision_service/configs
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video,graphics"
      PYTHONPATH: "/workspace"
    volumes:
      # Project root as read-only (code, configs, scripts)
      - type: bind
        source: ${PWD}
        target: /workspace
        read_only: false
      # Models directory as read-write (for TensorRT engine output)
      - type: bind
        source: ${PWD}/apps/vision_service/models
        target: /workspace/apps/vision_service/models
      # Logs as read-write
      - storage_logs:/workspace/storage/logs
    ports:
      # RTSP output stream (internal 8554 → host 8554)
      - "8554:8554"
      # Prometheus metrics endpoint
      - "9100:9100"
    command: ["python3", "/workspace/apps/vision_service/src/main.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: uit_medseg_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: uit_medseg_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/helmet_detection.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  storage_logs:
  prometheus_data:
  grafana_data:
