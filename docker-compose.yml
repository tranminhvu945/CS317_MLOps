# docker-compose.yml — DeepStream + Telegram alert stack

services:
  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: uit_medseg/mlflow-server:dev
    container_name: uit_medseg_mlflow
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ${PWD}:/workspace
    working_dir: /workspace

  redis:
    image: redis:7-alpine
    container_name: uit_medseg_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: uit_medseg_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "9997:9997"
    volumes:
      - ./configs/mediamtx.yml:/mediamtx.yml:ro

  vision-service:
    build:
      context: .
      dockerfile: Dockerfile.ds64_glib
    image: uit_medseg/vision-service:dev
    container_name: uit_medseg_vision
    tty: true
    stdin_open: true
    restart: unless-stopped
    depends_on:
      - redis
      - mediamtx
    shm_size: 2g
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: uit-medseg-vision
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GPU_ID: ${GPU_ID:-0}
      CONFIG_DIR: /workspace/apps/vision_service/configs
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video,graphics"
      PYTHONPATH: "/workspace"
      TELEGRAM_MIN_CONSEC_NO_HELMET_FRAMES: ${TELEGRAM_MIN_CONSEC_NO_HELMET_FRAMES:-3}
      MIN_CONSECUTIVE_NO_HELMET_FRAMES: ${MIN_CONSECUTIVE_NO_HELMET_FRAMES:-3}
      TELEGRAM_SNAPSHOT_SOURCE: ${TELEGRAM_SNAPSHOT_SOURCE:-probe}
    volumes:
      - type: bind
        source: ${PWD}
        target: /workspace
        read_only: false
    ports:
      - "9105:9100"
    command: ["python3", "/workspace/apps/vision_service/src/main.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_ID:-0}']
              capabilities: [gpu]

  telegram-worker:
    build:
      context: ./apps/telegram_worker
      dockerfile: Dockerfile
    image: uit_medseg/telegram-worker:dev
    container_name: uit_medseg_telegram_worker
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CHANNEL: ${REDIS_CHANNEL:-helmet_violations}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DEBUG_ALERT_TEXT_FIRST: ${DEBUG_ALERT_TEXT_FIRST:-false}
    volumes:
      - type: bind
        source: ${PWD}/storage
        target: /workspace/storage
        read_only: false

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: uit_medseg_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: uit_medseg_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3005"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/helmet_detection.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3005:3000"

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
