name: CI - MLOps Helmet Detection

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  python-check:
    name: Python syntax and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Run lint check
        run: |
          ruff check . || true

      - name: Run tests
        run: |
          if [ -d tests ]; then pytest tests -q; else echo "No tests directory, skipped."; fi

  dvc-check:
    name: DVC pipeline validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Check DVC files
        run: |
          dvc --version
          if [ -f dvc.yaml ]; then dvc dag; else echo "No dvc.yaml found."; fi
          if [ -f dvc.yaml ]; then dvc status || true; fi

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image only
        run: |
          if [ -f Dockerfile ]; then docker build -t helmet-detection-ci:test .; else echo "No Dockerfile found."; fi
