<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLOps Camera Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0d14;--surface:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--accent:#6c63ff;--accent2:#00d4aa;--danger:#ff4757;--text:#e8eaf0;--muted:#8892a4}
body{background:var(--bg);color:var(--text);font-family:Inter,sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(108,99,255,.15),transparent);pointer-events:none;z-index:0}
.header{position:sticky;top:0;z-index:100;background:rgba(10,13,20,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
.logo-dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,99,255,.4)}50%{box-shadow:0 0 0 8px rgba(108,99,255,0)}}
.badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(0,212,170,.12);color:var(--accent2);border:1px solid rgba(0,212,170,.25)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
main{position:relative;z-index:1;padding:24px 28px;max-width:1600px;margin:0 auto}

/* === AI OUTPUT HERO === */
.ai-hero{background:var(--surface);border:1px solid rgba(108,99,255,.35);border-radius:20px;overflow:hidden;margin-bottom:32px;box-shadow:0 0 48px rgba(108,99,255,.12)}
.ai-hero-header{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(108,99,255,.06)}
.ai-hero-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.ai-label{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 10px;border-radius:20px}
.live-tag{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#ff6b7a;border:1px solid rgba(255,71,87,.3);border-radius:20px;padding:3px 10px;background:rgba(255,71,87,.1)}
.live-tag span{width:6px;height:6px;border-radius:50%;background:#ff4757;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ai-url-bar{padding:12px 22px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.2)}
.ai-url-bar label{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500}
.ai-url-bar input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-family:Inter,sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.ai-url-bar input:focus{border-color:var(--accent)}
.btn-sm{padding:7px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-family:Inter,sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.btn-sm:hover{opacity:.85}

/* === STATS === */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat-icon.p{background:rgba(108,99,255,.15)}
.stat-icon.t{background:rgba(0,212,170,.15)}
.stat-icon.o{background:rgba(255,165,2,.15)}
.stat-icon.r{background:rgba(255,71,87,.15)}
.stat-value{font-size:22px;font-weight:700;line-height:1}
.stat-label{font-size:11px;color:var(--muted);margin-top:3px}

/* === ADD PANEL === */
.add-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:28px}
.add-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.add-header h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ci{transition:transform .3s;color:var(--muted);font-size:20px;line-height:1}
.ci.open{transform:rotate(45deg)}
.add-form{display:none;margin-top:18px;gap:14px;flex-direction:column}
.add-form.show{display:flex}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:Inter,sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--accent)}
.fg select option{background:#1a1d2e}
.btn-primary{padding:10px 22px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;gap:8px}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.form-actions{display:flex;justify-content:flex-end}

/* === CAMERA GRID === */
.section-title{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.camera-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:32px}
.cam-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.cam-card:hover{transform:translateY(-2px);border-color:rgba(108,99,255,.4);box-shadow:0 8px 32px rgba(108,99,255,.12)}
.cam-card.disabled{opacity:.5}
.vid-wrap{position:relative;aspect-ratio:16/9;background:#0d1117;overflow:hidden}
.cam-ov{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.type-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border:1px solid var(--border)}
.no-feed{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--muted);font-size:12px;position:absolute;inset:0}
.cam-info{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.05);position:relative;z-index:2;background:var(--bg)}
.cam-name{font-size:13px;font-weight:600}
.cam-id{font-size:11px;color:var(--muted);margin-top:2px}
.cam-ctrls{display:flex;gap:7px;align-items:center}
.btn-icon{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px}
.btn-icon:hover{border-color:var(--accent);color:var(--accent)}
.btn-icon.del:hover{border-color:var(--danger);color:var(--danger)}
.tog{width:42px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s}
.tog.on{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.tog.off{background:rgba(255,255,255,.1)}
.tog-thumb{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tog.on .tog-thumb{left:23px}
.tog.off .tog-thumb{left:3px}

/* === TOAST === */
#tc{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:10px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;backdrop-filter:blur(20px);animation:sIn .3s ease;min-width:240px;border:1px solid}
.toast.s{background:rgba(0,212,170,.15);border-color:rgba(0,212,170,.3);color:#00d4aa}
.toast.e{background:rgba(255,71,87,.15);border-color:rgba(255,71,87,.3);color:#ff6b7a}
.toast.i{background:rgba(108,99,255,.15);border-color:rgba(108,99,255,.3);color:#a5a1ff}
@keyframes sIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes sOut{to{opacity:0;transform:translateX(16px)}}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* === TABS NAV === */
.tabs {
  display: flex;
  gap: 10px;
}
.tab-btn {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 8px 18px;
  border-radius: 20px;
  font-family: Inter, sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover {
  border-color: rgba(255, 255, 255, 0.2);
  color: var(--text);
}
.tab-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border-color: transparent;
  box-shadow: 0 0 16px rgba(108,99,255,.35);
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === VIOLATIONS EXPLORER === */
.violations-container {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.camera-section {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  backdrop-filter: blur(10px);
}
.camera-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  padding-bottom: 14px;
  margin-bottom: 20px;
}
.camera-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
}
.camera-section-title span.cam-badge {
  background: rgba(108, 99, 255, 0.15);
  color: #a5a1ff;
  border: 1px solid rgba(108, 99, 255, 0.25);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
}
.camera-section-count {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  background: rgba(255, 255, 255, 0.04);
  padding: 4px 12px;
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.violations-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}
.violation-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 12px;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  position: relative;
}
.violation-card:hover {
  transform: translateY(-4px);
  border-color: rgba(108, 99, 255, 0.3);
  box-shadow: 0 12px 24px rgba(108, 99, 255, 0.15);
  background: rgba(255, 255, 255, 0.04);
}
.violation-img-wrapper {
  position: relative;
  aspect-ratio: 16/10;
  background: #090b11;
  overflow: hidden;
}
.violation-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}
.violation-card:hover .violation-img {
  transform: scale(1.06);
}
.violation-conf-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 10px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 6px;
  backdrop-filter: blur(8px);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.15);
}
.violation-info {
  padding: 12px 14px;
}
.violation-time {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 5px;
}
.violation-id {
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
  font-family: monospace;
}
.empty-camera {
  text-align: center;
  padding: 32px 16px;
  color: var(--muted);
  font-size: 13px;
  background: rgba(0, 0, 0, 0.15);
  border-radius: 12px;
  border: 1px dashed rgba(255, 255, 255, 0.05);
}

/* === LIGHTBOX MODAL === */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(10, 13, 20, 0.85);
  backdrop-filter: blur(25px);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  padding: 24px;
}
.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}
.lightbox-content {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  max-width: 900px;
  width: 100%;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
  transform: scale(0.95);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
}
.lightbox.open .lightbox-content {
  transform: scale(1);
}
.lightbox-header {
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}
.lightbox-body {
  position: relative;
  aspect-ratio: 16/9;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lightbox-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.lightbox-footer {
  padding: 16px 24px;
  background: rgba(0, 0, 0, 0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.lightbox-close {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 700;
}
.lightbox-close:hover {
  background: var(--danger);
  border-color: transparent;
}

/* === PAGINATION === */
.pagination-ctrl {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.pagination-ctrl button {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.pagination-ctrl button:hover:not(:disabled) {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}
.pagination-ctrl button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.pagination-ctrl span {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

/* === DATE GROUP === */
.date-group {
  margin-bottom: 24px;
}
.date-group:last-child {
  margin-bottom: 0;
}
.date-group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  color: #a5a1ff;
  margin-bottom: 14px;
  padding: 4px 12px;
  background: rgba(108, 99, 255, 0.08);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
  width: fit-content;
}
</style>
</head>
<body>
<div id="tc"></div>
<header class="header">
  <div class="logo"><div class="logo-dot"></div>MLOps Camera Dashboard</div>
  <div class="badge"><div class="dot"></div><span id="ds-status">DeepStream REST API :9091</span></div>
</header>
<main>

<!-- TAB 1: VIOLATIONS EXPLORER -->
<div id="tab-violations" class="tab-content active">
  <div class="violations-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
    <div>
      <h2 style="font-size:20px; font-weight:700; background: linear-gradient(135deg, #fff, var(--muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom:4px;">Nhật Ký Ảnh Vi Phạm Theo Camera</h2>
      <p style="font-size:12px; color:var(--muted)">Xem ảnh chụp vi phạm hệ thống tự động lưu trữ khi gửi cảnh báo Telegram</p>
    </div>
    <button class="btn-sm" onclick="loadViolations()" style="display:flex; align-items:center; gap:8px;">
      🔄 Làm mới dữ liệu
    </button>
  </div>
  
  <div id="violations-container" class="violations-container">
    <div style="text-align:center;padding:40px;color:var(--muted)"><div class="spin"></div><p style="margin-top:12px;font-size:13px">Đang tải...</p></div>
  </div>
</div>
</main>

<!-- LIGHTBOX MODAL -->
<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-content" onclick="event.stopPropagation()">
    <div class="lightbox-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="lb-cam-name" style="font-weight:700; font-size:15px; color:#fff;">Camera</span>
        <span id="lb-cam-id" style="font-size:12px; color:var(--muted); font-family:monospace;">cam_id</span>
      </div>
      <button class="lightbox-close" onclick="closeLightbox(event)">✕</button>
    </div>
    <div class="lightbox-body">
      <img id="lb-img" class="lightbox-img" src="" alt="Violation Snapshot" />
    </div>
    <div class="lightbox-footer">
      <div id="lb-time" style="font-size:13px; font-weight:500; color:var(--text)">⏰ Thời gian: --</div>
      <div id="lb-conf" style="font-weight:700; font-size:14px;">🎯 Độ tin cậy: --</div>
    </div>
  </div>
</div>

<script>
const API='/api';
const cameraPages = {};
const itemsPerPage = 8;

function changePage(camId, newPage) {
  cameraPages[camId] = newPage;
  loadViolations();
}

function formatDate(ts) {
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}

async function loadViolations() {
  const container = document.getElementById('violations-container');
  
  try {
    const rCam = await fetch(`${API}/cameras`);
    const activeCams = await rCam.json();
    
    // Sắp xếp camera cố định thứ tự theo Camera ID (Alphabetical)
    activeCams.sort((a, b) => a.camera_id.localeCompare(b.camera_id));
    
    const rViolations = await fetch(`${API}/violations?limit=1000`);
    const violations = await rViolations.json();
    
    const grouped = {};
    activeCams.forEach(c => {
      grouped[c.camera_id] = {
        name: c.name || c.camera_id,
        items: []
      };
      // Khởi tạo trang mặc định nếu chưa có
      if (cameraPages[c.camera_id] === undefined) {
        cameraPages[c.camera_id] = 1;
      }
    });
    
    violations.forEach(v => {
      if (!grouped[v.camera_id]) {
        grouped[v.camera_id] = {
          name: v.camera_id,
          items: []
        };
        if (cameraPages[v.camera_id] === undefined) {
          cameraPages[v.camera_id] = 1;
        }
      }
      grouped[v.camera_id].items.push(v);
    });
    
    let html = '';
    const camIds = Object.keys(grouped);
    // Sắp xếp camera cố định theo bảng chữ cái (cam_001 -> cam_002 -> cam_003...)
    camIds.sort((a, b) => a.localeCompare(b));
    if (!camIds.length) {
      container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">🚨</div><p style="font-size:13px">Chưa cấu hình camera nào trong hệ thống.</p></div>';
      return;
    }
    
    camIds.forEach(id => {
      const cam = grouped[id];
      // Sắp xếp các vi phạm theo thứ tự thời gian mới nhất lên đầu
      const items = cam.items.sort((a, b) => b.timestamp - a.timestamp);
      const totalItems = items.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
      
      // Đảm bảo trang hiện tại hợp lệ
      if (cameraPages[id] > totalPages) {
        cameraPages[id] = totalPages;
      }
      if (cameraPages[id] < 1) {
        cameraPages[id] = 1;
      }
      
      const page = cameraPages[id];
      const startIdx = (page - 1) * itemsPerPage;
      const endIdx = page * itemsPerPage;
      const pageItems = items.slice(startIdx, endIdx);
      
      // Nhóm dữ liệu trong trang theo Từng Ngày
      const dateGroups = {};
      pageItems.forEach(item => {
        const dateStr = formatDate(item.timestamp);
        if (!dateGroups[dateStr]) {
          dateGroups[dateStr] = [];
        }
        dateGroups[dateStr].push(item);
      });
      
      html += `
        <div class="camera-section" id="section-${id}">
          <div class="camera-section-header">
            <div class="camera-section-title">
              📷 <span>${cam.name}</span>
              <span class="cam-badge">${id}</span>
            </div>
            <span class="camera-section-count">Tổng vi phạm: <strong>${totalItems}</strong></span>
          </div>
      `;
      
      if (!totalItems) {
        html += `
          <div class="empty-camera">
            🛡️ Không phát hiện vi phạm nào trên camera này.
          </div>
        `;
      } else {
        const dates = Object.keys(dateGroups);
        dates.forEach(dateStr => {
          html += `
            <div class="date-group">
              <div class="date-group-header">📅 Ngày ${dateStr}</div>
              <div class="violations-grid">
          `;
          
          dateGroups[dateStr].forEach(item => {
            const confidencePercent = (item.confidence * 100).toFixed(1) + '%';
            const confVal = item.confidence;
            const badgeBg = confVal >= 0.8 ? 'rgba(0, 212, 170, 0.85)' : confVal >= 0.5 ? 'rgba(255, 165, 2, 0.85)' : 'rgba(255, 71, 87, 0.85)';
            const formattedTime = formatTimestamp(item.timestamp);
            const imgSrc = item.snapshot_filename ? `/snapshots/${item.snapshot_filename}` : '';
            
            html += `
              <div class="violation-card" onclick="openLightbox('${cam.name.replace(/'/g, "\\'")}', '${id}', '${imgSrc}', '${formattedTime}', '${confidencePercent}')">
                <div class="violation-img-wrapper">
                  <img class="violation-img" src="${imgSrc}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1590250596386-414198379681?auto=format&fit=crop&w=400&q=80'" />
                  <span class="violation-conf-badge" style="background:${badgeBg};">${confidencePercent}</span>
                </div>
                <div class="violation-info">
                  <div class="violation-time">⏰ ${formattedTime}</div>
                  <div class="violation-id">🆔 Event ID: <code>${item.event_id}</code></div>
                </div>
              </div>
            `;
          });
          
          html += `
              </div>
            </div>
          `;
        });
        
        // Hiển thị thanh phân trang nếu tổng số trang lớn hơn 1
        if (totalPages > 1) {
          html += `
            <div class="pagination-ctrl">
              <button onclick="changePage('${id}', ${page - 1})" ${page === 1 ? 'disabled' : ''}>◀ Trang trước</button>
              <span>Trang ${page} / ${totalPages}</span>
              <button onclick="changePage('${id}', ${page + 1})" ${page === totalPages ? 'disabled' : ''}>Trang sau ▶</button>
            </div>
          `;
        }
      }
      
      html += '</div>';
    });
    
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--danger)">⚠️ Lỗi tải dữ liệu vi phạm: ${err.message}</div>`;
  }
}

function formatTimestamp(ts) {
  if (!ts) return '--:--:--';
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
}

function openLightbox(camName, camId, imgSrc, timeStr, confStr) {
  document.getElementById('lb-cam-name').textContent = camName;
  document.getElementById('lb-cam-id').textContent = camId;
  document.getElementById('lb-img').src = imgSrc;
  document.getElementById('lb-time').textContent = '⏰ Thời gian: ' + timeStr;
  document.getElementById('lb-conf').textContent = '🎯 Độ tin cậy: ' + confStr;
  
  const confVal = parseFloat(confStr);
  const lbConf = document.getElementById('lb-conf');
  lbConf.style.color = confVal >= 80 ? 'var(--accent2)' : confVal >= 50 ? '#ffa502' : 'var(--danger)';
  
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(e) {
  document.getElementById('lightbox').classList.remove('open');
}

// Khởi chạy ban đầu
loadViolations();

setInterval(loadViolations, 10000); // Tự động làm mới danh sách vi phạm mỗi 10 giây
</script>
