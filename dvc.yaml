stages:

  # ─── Stage 2.5: Giải nén WebDataset Shards ───────────────────────────────
  extract:
    cmd: python scripts/extract_shards.py --shards-dir dataset/shards --output-dir dataset/extracted/yolo_helmet_dataset --limit ${sharding.extract_limit}
    deps:
      - dataset/shards
      - scripts/extract_shards.py
    outs:
      - dataset/extracted/yolo_helmet_dataset:
          cache: false

  # ─── Stage 3: Huấn luyện model YOLO ──────────────────────────────────────
  train:
    cmd: python dataset/TrainYolo/train_yolo.py
    deps:
      - dataset/TrainYolo/train_yolo.py
      - dataset/extracted/yolo_helmet_dataset
      - dataset/dataset.yaml
    params:
      - params.yaml:
          - model.name
          - train.epochs
          - train.imgsz
          - train.batch
          - train.patience
          - train.device
          - train.project
          - train.name
    outs:
      - runs/detect/${train.project}/${train.name}/weights/best.pt:
          cache: true
    metrics:
      - runs/detect/${train.project}/${train.name}/results.csv:
          cache: false

  # ─── Stage 4: Export best.pt sang ONNX ───────────────────────────────────
  export:
    cmd: python3 scripts/export_onnx.py
    deps:
      - scripts/export_onnx.py
      - runs/detect/${train.project}/${train.name}/weights/best.pt
    params:
      - params.yaml:
          - mlflow.tracking_uri
          - mlflow.registry_name
          - mlflow.deploy_alias
    outs:
      - apps/vision_service/models/yolov8/yolov8_helmet.onnx:
          cache: false

  # ─── Stage 5: Biên dịch ONNX sang TensorRT Engine ────────────────────────
  compile:
    cmd: make build-engine
    deps:
      - scripts/build_engine.sh
      - apps/vision_service/models/yolov8/yolov8_helmet.onnx
    outs:
      - apps/vision_service/models/yolov8/yolov8_helmet.onnx_b1_gpu0_fp16.engine:
          cache: true
