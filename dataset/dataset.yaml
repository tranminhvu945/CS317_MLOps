# Đường dẫn tuyệt đối đến thư mục gốc chứa dataset YOLO vừa tạo
path: dataset/extracted/yolo_helmet_dataset

# Đường dẫn tương đối từ 'path' đến các thư mục chứa ảnh
train: images/train
val: images/val
test: images/test

# Cấu hình số lượng và tên class (đã map về 2 class)
nc: 2
names:
  0: helmet       # Tuân thủ (Cả người lái & người ngồi sau đều đội mũ)
  1: no_helmet  # Vi phạm (Có ít nhất 1 người không đội mũ)